<!DOCTYPE html>
<html lang="en" xml:lang="en">

<head>
  <title>Overview</title>
  <meta charset="UTF-8" />

  <style>
    .tg {
      border-collapse: collapse;
      border-spacing: 0;
      width: 100%;
      min-width: 600px;
      height: 100%;
      color: darkslategray;
    }

    .tg th {
      min-width: 325px;
      width: 325px;
      height: 20px;
      font-size: 18px;
      text-align: left;
      font-weight: bold;
      padding: 5px 10px 5px 10px;
      overflow: hidden;
      word-break: normal;
      background-color: lightgrey;
    }

    .tg td {
      font-size: 15px;
      padding: 5px 10px 5px 10px;
      overflow: hidden;
      word-break: normal;
    }

    .tg .tg-1 {
      font-size: 15px;
      vertical-align: top;
      font-family: Arial, Helvetica, sans-serif !important;
    }

    .tg .tg-2 {
      height: 52px;
      font-size: 15px;
      padding: 3px 0px 3px 10px;
      vertical-align: middle;
      font-family: Arial, Helvetica, sans-serif !important;
    }

    .tg .tg-3 {
      height: 45px;
      font-size: 15px;
      padding: 3px 10px 3px 10px;
      vertical-align: middle;
      font-family: Arial, Helvetica, sans-serif !important;
    }

    .tg .tg-4 {
      height: fit-content;
      font-size: 15px;
      padding: 5px 10px 5px 10px;
      vertical-align: text-top;
      font-family: Arial, Helvetica, sans-serif !important;
    }

    img {
      padding-left: 5px;
      padding-top: 0px;
      max-width: 100%;
      width: 100%;
      height: auto;
    }
  </style>

</head>

<body style="font-family: arial">

  <table class="tg">
    <tr>
      <th class="th">Value</th>
      <td class="tg-1" rowspan="13">
        <img id="img" src="">
      </td>
    </tr>
    <tr>
      <td class="tg-2">
        <div id="value"></div>
      </td>
    </tr>
    <tr>
      <th class="th">Previous Value</th>
    </tr>
    <tr>
      <td class="tg-2">
        <div id="prevalue"></div>
      </td>
    </tr>
    <tr>
      <th class="th">Raw Value</th>
    </tr>
    <tr>
      <td class="tg-2">
        <div id="raw"></div>
      </td>
    </tr>
    <tr>
      <th class="th">Value Status</th>
    </tr>
    <tr>
      <td class="tg-2">
        <div id="error"></div>
      </td>
    </tr>
    <tr>
      <th class="th">Process State</th>
    </tr>
    <tr>
      <td class="tg-3">
        <div id="statusflow"></div>
      </td>
    </tr>
    <tr>
      <th class="th">System Info</th>
    </tr>
    <tr>
      <td class="tg-4">
        <div id="sntp_date"></div>
        <div id="timestamp"></div>
        <div id="cputemp"></div>
        <div id="rssi"></div>
        <div>
          <span id="uptime"></span>
          <span id="round"></span>
        </div>
      </td>
    </tr>
  </table>

  <script type="text/javascript" src="common.js?v=$COMMIT_HASH"></script>
  <script type="text/javascript" src="readconfigcommon.js?v=$COMMIT_HASH"></script>
  <script type="text/javascript" src="readconfigparam.js?v=$COMMIT_HASH"></script>

  <script type="text/javascript">
    const origin = getDomainname();

    document.addEventListener('DOMContentLoaded', function () {
      refresh();
      loadData();
      loadRoiImage();
    });

    function refresh() {
      setTimeout(function () {
        loadData();
        loadRoiImage();
        refresh();
      }, 300000);
    }

    async function loadData() {
      const url = origin + '/overview_json';

      try {
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();

        if (data.value !== undefined) {
          updateValueDiv("value", data.value, "border-collapse: collapse; width: 100%");
        }

        if (data.prevalue !== undefined) {
          updateValueDiv("prevalue", data.prevalue, "border-collapse: collapse; width: 100%");
        }

        if (data.raw !== undefined) {
          updateValueDiv("raw", data.raw, "border-collapse: collapse; width: 100%");
        }

        if (data.error !== undefined) {
          updateValueDiv("error", data.error, "border-collapse: collapse; width: 100%");
        }

        if (data.statusflow !== undefined) {
          document.getElementById('statusflow').textContent = data.statusflow;
        }

        if (data.date !== undefined) {
          document.getElementById('sntp_date').textContent = "Date/Time on device: " + data.date;
        }

        if (data.cputemp !== undefined) {
          document.getElementById('cputemp').textContent = "CPU Temperature: " + data.cputemp + "°C";
        }

        if (data.rssi !== undefined) {
          var rssi = parseInt(data.rssi);
          var rssiElement = document.getElementById('rssi');
          if (rssi >= -55) {
            rssiElement.textContent = "WIFI Signal: Excellent (" + rssi + "dBm)";
          }
          else if (rssi < -55 && rssi >= -67) {
            rssiElement.textContent = "WIFI Signal: Good (" + rssi + "dBm)";
          }
          else if (rssi < -67 && rssi >= -78) {
            rssiElement.textContent = "WIFI Signal: Fair (" + rssi + "dBm)";
          }
          else if (rssi < -78 && rssi >= -85) {
            rssiElement.textContent = "WIFI Signal: Weak (" + rssi + "dBm)";
          }
          else {
            rssiElement.textContent = "WIFI Signal: Unreliable (" + rssi + "dBm)";
          }
        }

        if (data.uptime !== undefined) {
          document.getElementById('uptime').textContent = "Uptime: " + data.uptime;
        }

        if (data.round !== undefined) {
          document.getElementById('round').textContent = "(Round: " + data.round + ")";
        }
      }
      catch (e) {
        console.error("Error loading overview data:", e);
      }
    }

    function updateValueDiv(id, data, style) {
      var lines = data.split("\r");
      var content;

      if (typeof style == undefined) {
        content = "<table>";
      }
      else {
        content = "<table style=\"" + style + "\">";
      }

      if (lines.length == 1) {
        var values = ZerlegeZeile(lines[0], "\t")

        if (values.length > 1) {
          content = values[1];
        }
        else {
          content = "";
        }
      }
      else {
        lines.forEach(function (line) {
          var values = ZerlegeZeile(line, "\t")

          if (values.length == 1) {
            content = content + "<tr><td style=\"width: 22%; padding: 3px 5px; text-align: left; vertical-align:middle; border: 1px solid lightgrey\">" +
              values[0] + "</td><td style=\"padding: 3px 5px; text-align: left; vertical-align:middle; border: 1px solid lightgrey\"> </td></tr>";
          }
          else {
            content = content + "<tr><td style=\"width: 22%; padding: 3px 5px; text-align: left; vertical-align:middle; border: 1px solid lightgrey\">" +
              values[0] + "</td><td style=\"padding: 3px 5px; text-align: left; vertical-align:middle; border: 1px solid lightgrey\" >" + values[1] + "</td></tr>";
          }
        });

        content = content + "</table>"
      }
      document.getElementById(id).innerHTML = content;
    }

    function loadRoiImage() {
      var d = new Date();
      var timestamp = d.getTime();
      var h = addZero(d.getHours());
      var m = addZero(d.getMinutes());
      var s = addZero(d.getSeconds());

      document.getElementById("img").src = origin + '/img_tmp/alg_roi.jpg?timestamp=' + timestamp;
      document.getElementById('timestamp').textContent = "Last Page Refresh:" + (h + ":" + m + ":" + s);
    }

    function addZero(i) {
      if (i < 10) {
        i = "0" + i;
      }
      return i;
    }

  </script>
</body>

</html>
